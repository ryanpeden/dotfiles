- defaults:
    link:
      relink: true
      force: true
      backup: true

- link:
    ~/.config/ruff/ruff.toml:
      create: true
      path: config/ruff/ruff.toml
    ~/.gitconfig: config/git/gitconfig
    ~/.jupyter/lab/user-settings/@jupyterlab/apputils-extension/themes.jupyterlab-settings:
      create: true
      path: config/jupyter/lab/user-settings/@jupyterlab/apputils-extension/themes.jupyterlab-settings
    ~/.jupyter/lab/user-settings/@jupyterlab/notebook-extension/tracker.jupyterlab-settings:
      create: true
      path: config/jupyter/lab/user-settings/@jupyterlab/notebook-extension/tracker.jupyterlab-settings
    ~/.p10k.zsh: config/zsh/p10k.zsh
    ~/.tmux.conf: config/tmux/tmux.conf
    ~/.vimrc: config/vim/vimrc
    ~/.zshrc: config/zsh/zshrc
    "~/Library/Application Support/Code/User/settings.json":
      create: true
      path: config/vscode/settings.json

- shell:
    - command: ./scripts/setup_homebrew.sh
      description: Installing Homebrew packages
    - command: ./scripts/setup_python.sh
      description: Setting up Python environment
    - command: ./scripts/setup_vim.sh
      description: Setting up Vim plugins
    - command: ./scripts/setup_macos.sh
      description: Configuring macOS defaults

- clean: ['~']
